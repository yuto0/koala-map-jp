<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pedigree - Koala Map JP</title>

  <style>
    :root {
      --ink: #1c1a16;
      --ink-soft: #4a4036;
      --paper: #f3ead8;
      --paper-deep: #eadcc3;
      --accent: #8b2a1b;
      --border: #b8a287;
      --seal: #b43c2f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Shippori Mincho", "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif;
      background:
        radial-gradient(1200px 600px at 20% -10%, #fff7e8 0%, transparent 60%),
        radial-gradient(900px 500px at 90% -20%, #fff0d8 0%, transparent 55%),
        linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0 1px, transparent 1px 6px),
        repeating-linear-gradient(-45deg, rgba(0,0,0,0.02) 0 1px, transparent 1px 7px);
      mix-blend-mode: multiply;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      padding: 16px 18px;
      border-bottom: 2px solid var(--border);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.65), rgba(255,255,255,0.25));
    }

    header .title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .seal {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      border: 2px solid #7e1f15;
      color: #7e1f15;
      display: grid;
      place-items: center;
      font-family: "Yuji Syuku", "Noto Serif JP", serif;
      font-size: 16px;
      letter-spacing: 2px;
      background: #f6d9d5;
      box-shadow: 0 2px 0 rgba(0,0,0,0.1);
      transform: rotate(-2deg);
    }

    #title {
      font-size: 20px;
      letter-spacing: 1px;
    }

    .meta {
      color: var(--ink-soft);
      font-size: 12px;
      margin-top: 6px;
    }

    #net {
      height: calc(100vh - 110px);
      position: relative;
      z-index: 1;
      background:
        linear-gradient(rgba(255, 255, 255, 0.58), rgba(255, 255, 255, 0.58)),
        url("./assets/image.png") center / cover no-repeat,
        repeating-linear-gradient(
          180deg,
          rgba(248,241,227,0.45) 0px,
          rgba(248,241,227,0.45) 120px,
          rgba(255,255,255,0) 120px,
          rgba(255,255,255,0) 150px
        );
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--ink-soft);
      align-items: center;
    }
    .btn {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff7ea;
      color: var(--ink-soft);
      cursor: pointer;
    }
    .controls label {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      cursor: pointer;
    }
    .legend {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: var(--ink-soft);
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.female { background: #b13a2a; }
    .dot.male   { background: #2f5c8f; }

    a { color: inherit; }

    @media (max-width: 720px) {
      header {
        padding: 14px 14px;
      }
      #title { font-size: 18px; }
      #net { height: calc(100vh - 120px); }
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Yuji+Syuku&display=swap" rel="stylesheet">

  <!-- vis-network (CDN) -->
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
  <header>
    <div class="title-wrap">
      <div class="seal">系図</div>
      <div><strong id="title">家系図</strong></div>
    </div>
    <div class="meta"><a id="backLink" href="./zoo.html?zooId=higashiyama-zoo">← 一覧へ戻る</a> / <a id="allLink" href="./pedigree-all.html">全体図へ</a></div>
    <div class="meta">ノードクリックでその個体に移動 / ドラッグで移動 / ホイールで拡大</div>
    <div class="controls">
      <label><input id="toggleSex" type="checkbox" checked> 性別</label>
      <label><input id="toggleBirth" type="checkbox" checked> 生年月日</label>
      <span class="legend"><span class="dot female"></span>メス</span>
      <span class="legend"><span class="dot male"></span>オス</span>
      <span class="legend" style="color:var(--ink-soft)">† 天国</span>
      <span class="legend" style="color:var(--ink-soft)">▲ さらに遡れる</span>
      <button id="centerRoot" class="btn" type="button">中心へ</button>
      <button id="fitAll" class="btn" type="button">全体表示</button>
    </div>
  </header>

  <div id="net"></div>

  <script>
    const API_BASE = "/api";

    const params = new URLSearchParams(location.search);
    const koalaId = params.get("koalaId") || "monaka";
    const depth = parseInt(params.get("depth") || "2");
    const includeChildren = (params.get("includeChildren") || "1") !== "0";
    const zooId = params.get("zooId") || "higashiyama-zoo";

    document.getElementById("backLink").href = `./zoo.html?zooId=${encodeURIComponent(zooId)}`;
    document.getElementById("allLink").href = `./pedigree-all.html?zooId=${encodeURIComponent(zooId)}`;

    main().catch(err => {
      console.error(err);
      alert("家系図の読み込みに失敗しました: " + err.message);
    });

    async function main() {
      const res = await fetch(`${API_BASE}/koalas/${encodeURIComponent(koalaId)}/pedigree?depth=${depth}&includeChildren=${includeChildren ? 1 : 0}`);
      if (!res.ok) throw new Error(`API error: ${res.status}`);
      const data = await res.json();

      const rootId = data.rootId;
      const rawNodes = data.nodes.map(n => ({
        id: n.id,
        name: n.name || "（不明）",
        sex: n.sex || "U",
        birthDate: n.birthDate || "",
        status: n.status || "unknown",
        hasParents: !!n.hasParents,
      }));
      const nodeMap = new Map(rawNodes.map(n => [n.id, n]));

      // ページタイトル更新
      const rootRaw = nodeMap.get(rootId);
      if (rootRaw) {
        document.getElementById("title").textContent = `${rootRaw.name} の家系図`;
      }

      // エッジから関係マップを構築
      const childToMother = new Map(); // childId → motherId
      const childToFather = new Map(); // childId → fatherId
      const motherToChildren = new Map();
      const fatherToChildren = new Map();

      for (const e of data.edges) {
        if (e.type === "mother") {
          childToMother.set(e.to, e.from);
          if (!motherToChildren.has(e.from)) motherToChildren.set(e.from, []);
          motherToChildren.get(e.from).push(e.to);
        } else {
          childToFather.set(e.to, e.from);
          if (!fatherToChildren.has(e.from)) fatherToChildren.set(e.from, []);
          fatherToChildren.get(e.from).push(e.to);
        }
      }

      // 祖先セット（ルートから上方向にBFS）
      const ancestorSet = new Set([rootId]);
      const ancQ = [rootId];
      while (ancQ.length > 0) {
        const nid = ancQ.shift();
        const mid = childToMother.get(nid);
        const fid = childToFather.get(nid);
        if (mid && !ancestorSet.has(mid)) { ancestorSet.add(mid); ancQ.push(mid); }
        if (fid && !ancestorSet.has(fid)) { ancestorSet.add(fid); ancQ.push(fid); }
      }

      // パートナーセット（ルートの子の共同親で、祖先でないもの）
      const partnerSet = new Set();
      const rootChildren = [
        ...(motherToChildren.get(rootId) || []),
        ...(fatherToChildren.get(rootId) || []),
      ];
      for (const cid of rootChildren) {
        const mid = childToMother.get(cid);
        const fid = childToFather.get(cid);
        if (mid && !ancestorSet.has(mid)) partnerSet.add(mid);
        if (fid && !ancestorSet.has(fid)) partnerSet.add(fid);
      }

      // ルートに祖先がいるかどうか（ancestorSet はルート自身を含む）
      const rootHasAncestors = ancestorSet.size > 1;

      // 子どもを（母, 父）ペアでグループ化 → ユニオンノード生成
      const pairMap = new Map(); // "motherId|fatherId" → { motherId, fatherId, children[] }
      for (const n of rawNodes) {
        const mid = childToMother.get(n.id) || "";
        const fid = childToFather.get(n.id) || "";
        if (!mid && !fid) continue;
        const key = `${mid}|${fid}`;
        if (!pairMap.has(key)) pairMap.set(key, { motherId: mid, fatherId: fid, children: [] });
        pairMap.get(key).children.push(n.id);
      }

      // ユニオンノードと再構築したエッジを生成
      const rootLevel = depth * 2;
      const unionNodes = [];
      const structuredEdges = [];

      for (const [key, { motherId: mid, fatherId: fid, children }] of pairMap) {
        if (mid && fid) {
          // 両親が揃っている → ユニオンノード経由
          const unionId = `union:${key}`;
          const mName = nodeMap.get(mid)?.name || "";
          const fName = nodeMap.get(fid)?.name || "";
          unionNodes.push({
            id: unionId,
            label: "",
            shape: "dot",
            size: 7,
            color: { background: "#c4a882", border: "#c4a882", highlight: { background: "#a08060", border: "#a08060" }, hover: { background: "#a08060", border: "#a08060" } },
            title: `${mName} × ${fName}`,
            font: { size: 1 },
          });
          structuredEdges.push({ from: mid, to: unionId, arrows: "", width: 2, color: { color: "#b13a2a" }, smooth: { type: "straightCross" } });
          structuredEdges.push({ from: fid, to: unionId, arrows: "", width: 2, color: { color: "#2f5c8f" }, smooth: { type: "straightCross" } });
          for (const cid of children) {
            structuredEdges.push({ from: unionId, to: cid, arrows: "to", width: 1.5, color: { color: "#7a6045" }, smooth: { type: "cubicBezier", forceDirection: "vertical", roundness: 0.3 } });
          }
        } else {
          // 片親のみ → 直接エッジ
          const parentId = mid || fid;
          const color = mid ? "#b13a2a" : "#2f5c8f";
          for (const cid of children) {
            structuredEdges.push({ from: parentId, to: cid, arrows: "to", width: 2, color: { color }, smooth: { type: "cubicBezier", forceDirection: "vertical", roundness: 0.3 } });
          }
        }
      }

      // ノードカラー（性別 × 生死）
      function nodeColors(sex, deceased) {
        if (sex === "M") return { bg: deceased ? "#e8f2fc" : "#dce8f5", border: deceased ? "#7aacce" : "#2f5c8f" };
        if (sex === "F") return { bg: deceased ? "#fceef4" : "#f5dce8", border: deceased ? "#d4879d" : "#b13a2a" };
        return { bg: deceased ? "#f0f0f0" : "#e8e8e8", border: deceased ? "#bbb" : "#999" };
      }

      const toggleSex = document.getElementById("toggleSex");
      const toggleBirth = document.getElementById("toggleBirth");

      function formatLabel(n) {
        const showSex = toggleSex?.checked ?? true;
        const showBirth = toggleBirth?.checked ?? true;
        const sym = n.sex === "M" ? "♂" : n.sex === "F" ? "♀" : "?";
        const lines = [showSex ? `${sym} ${n.name}` : n.name];
        if (showBirth && n.birthDate && !n.birthDate.startsWith("????")) lines.push(n.birthDate);
        if (n.status === "deceased") lines.push("† 天国");
        if (n.hasParents) lines.push("▲ 遡れる");
        return lines.join("\n");
      }

      function buildVisNode(n) {
        const isRoot = n.id === rootId;
        const deceased = n.status === "deceased";
        const { bg, border } = nodeColors(n.sex, deceased);
        const node = {
          id: n.id,
          label: formatLabel(n),
          shape: "ellipse",
          color: {
            background: bg,
            border: isRoot ? "#8b2a1b" : border,
            highlight: { background: bg, border: "#8b2a1b" },
            hover: { background: bg, border },
          },
          borderWidth: isRoot ? 3 : 2,
          shapeProperties: deceased ? { borderDashes: [5, 3] } : {},
          shadow: { enabled: true, color: "rgba(0,0,0,0.12)", size: 6, x: 2, y: 2 },
          title: n.hasParents ? `${n.name}（クリックでさらに遡る）` : n.name,
        };
        // パートナーはルートと同じ階層に固定
        // ルートに祖先がない場合（例: ishin）はlevel 0に置く
        if (partnerSet.has(n.id)) node.level = rootHasAncestors ? rootLevel : 0;
        return node;
      }

      const networkData = {
        nodes: new vis.DataSet([...rawNodes.map(buildVisNode), ...unionNodes]),
        edges: new vis.DataSet(structuredEdges),
      };

      const options = {
        physics: false,
        layout: {
          hierarchical: {
            enabled: true,
            direction: "UD",
            sortMethod: "directed",
            levelSeparation: 120,
            nodeSpacing: 200,
            treeSpacing: 220,
            blockShifting: true,
            edgeMinimization: true,
            parentCentralization: true,
          }
        },
        nodes: {
          font: {
            color: "#1c1a16",
            face: "Shippori Mincho, Noto Serif JP, Yu Mincho, serif",
            size: 13,
            align: "center",
          },
          widthConstraint: { minimum: 80, maximum: 150 },
        },
        edges: {
          smooth: { type: "cubicBezier", forceDirection: "vertical", roundness: 0.4 },
        },
        interaction: {
          hover: true,
          tooltipDelay: 300,
        }
      };

      const container = document.getElementById("net");
      const network = new vis.Network(container, networkData, options);

      network.on("click", p => {
        const targetId = p?.nodes?.[0];
        if (!targetId || String(targetId).startsWith("union:")) return;
        const next = new URLSearchParams(location.search);
        next.set("koalaId", targetId);
        location.href = `./pedigree.html?${next.toString()}`;
      });

      function updateLabels() {
        networkData.nodes.update(rawNodes.map(n => ({ id: n.id, label: formatLabel(n) })));
      }

      toggleSex.addEventListener("change", updateLabels);
      toggleBirth.addEventListener("change", updateLabels);
      document.getElementById("centerRoot").addEventListener("click", () => {
        if (rootId) network.focus(rootId, { scale: 1.1, animation: true });
      });
      document.getElementById("fitAll").addEventListener("click", () => network.fit({ animation: true }));
    }
  </script>
</body>
</html>
