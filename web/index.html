<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Koala Map JP (local)</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #2a221c;
      --ink-soft: #6b5b50;
      --paper: #f6efe4;
      --paper-deep: #efe4d2;
      --leaf: #6f8f5a;
      --bark: #b48a6a;
      --fur: #cdb39b;
      --frame: #dcc9b2;
      --accent: #9b5d3f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "M PLUS Rounded 1c", "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 10% -10%, #fff7e8 0%, transparent 60%),
        radial-gradient(900px 500px at 90% -20%, #fff1dc 0%, transparent 55%),
        linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
    }

    header {
      padding: 14px 16px;
      border-bottom: 2px solid var(--frame);
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(4px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: #f0e4d3;
      border: 2px solid var(--bark);
      position: relative;
      box-shadow: 0 2px 0 rgba(0,0,0,0.08);
    }
    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      top: -6px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--fur);
      border: 2px solid var(--bark);
    }
    .brand-mark::before { left: -4px; }
    .brand-mark::after { right: -4px; }
    .brand-mark .nose {
      position: absolute;
      left: 50%;
      top: 15px;
      width: 10px;
      height: 12px;
      background: #6a5548;
      border-radius: 999px;
      transform: translateX(-50%);
    }
    .brand-title { font-weight: 700; letter-spacing: 0.5px; }
    .meta { color: var(--ink-soft); font-size: 12px; margin-top: 4px; }

    /* 上：地図 / 下：一覧 */
    #app {
      display: grid;
      grid-template-rows: 60vh 1fr;
      height: calc(100vh - 58px);
    }
    #map {
      min-height: 240px;
      border-bottom: 2px solid var(--frame);
      box-shadow: inset 0 -6px 12px rgba(0,0,0,0.06);
    }
    #list {
      border-top: 2px solid var(--frame);
      overflow: auto;
      padding: 12px;
      background: rgba(255,255,255,0.45);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .toolbar input {
      padding: 8px 10px;
      border: 1px solid var(--frame);
      border-radius: 999px;
      min-width: 240px;
      background: #fffaf2;
      color: var(--ink);
      box-shadow: 0 1px 0 rgba(0,0,0,0.05);
    }
    .pill {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--frame);
      background: #fffaf2;
      color: var(--ink-soft);
    }
    .btn {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--frame);
      background: #fffaf2;
      color: var(--ink-soft);
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(0,0,0,0.05);
    }
    .empty {
      margin-top: 12px;
      color: var(--ink-soft);
      font-size: 12px;
      text-align: center;
      display: none;
    }
    .empty.show { display: block; }

    .cards { display: grid; gap: 10px; }
    .card {
      background: #fffaf2;
      border: 1px solid var(--frame);
      border-radius: 16px;
      padding: 12px 12px 14px;
      box-shadow:
        0 1px 0 rgba(0,0,0,0.05),
        0 8px 18px rgba(0,0,0,0.08);
      cursor: pointer;
    }
    .card:hover { border-color: #c3ad95; }
    .card.active {
      outline: 2px solid var(--accent);
      border-color: var(--accent);
    }
    .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .title { font-weight: 700; }
    .sub { color: var(--ink-soft); margin-top: 6px; font-size: 13px; }
    .small { color: var(--ink-soft); margin-top: 6px; font-size: 12px; }
    a { color: inherit; }

    .leaflet-control-attribution {
      background: rgba(255,255,255,0.6);
      border-radius: 6px;
      border: 1px solid var(--frame);
      color: var(--ink-soft);
    }
    .leaflet-popup-content-wrapper {
      background: #fffaf2;
      border: 1px solid var(--frame);
      border-radius: 14px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    .leaflet-popup-tip { background: #fffaf2; }

    /* Park map feel: soften details + paper overlay */
    #map .leaflet-tile {
      filter: saturate(1.1) contrast(0.9) brightness(1.05) blur(0.2px);
    }
    #map::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255,252,245,0.55), rgba(255,252,245,0.35)),
        radial-gradient(520px 320px at 18% 15%, rgba(255,255,255,0.25), transparent 60%),
        radial-gradient(700px 380px at 85% 20%, rgba(255,255,255,0.18), transparent 60%),
        repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0 1px, transparent 1px 7px);
      mix-blend-mode: multiply;
    }
    #map::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 16px;
      border: 2px dashed rgba(122, 93, 63, 0.25);
      pointer-events: none;
      z-index: 401;
    }
    .popup-card {
      min-width: 220px;
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 10px;
      align-items: center;
    }
    .popup-photo {
      width: 72px;
      height: 90px;
      border-radius: 8px;
      border: 1px solid var(--frame);
      object-fit: cover;
      background: #efe3d0;
      filter: sepia(0.15) saturate(0.9);
    }
    .popup-title { font-weight: 700; }
    .popup-sub { margin-top: 4px; color: var(--ink-soft); font-size: 12px; }
    .popup-actions { margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
    .action {
      display: inline-block;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--frame);
      background: #fffaf2;
      color: var(--ink-soft);
      text-decoration: none;
      box-shadow: 0 1px 0 rgba(0,0,0,0.05);
    }


    @media (max-width: 720px) {
      #app { grid-template-rows: 55vh 1fr; }
      .toolbar input { min-width: 200px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark"><span class="nose"></span></div>
      <div>
        <div class="brand-title">Koala Map JP</div>
        <div class="meta">コアラと動物園を結ぶ地図（ローカル）</div>
      </div>
    </div>
  </header>

  <div id="app">
    <div id="map"></div>
    <div id="list">
      <div class="toolbar">
        <input id="q" type="search" placeholder="動物園名 / 都道府県 / 市区町村で検索" />
        <button id="clearSearch" class="btn" type="button">クリア</button>
        <button id="fitAll" class="btn" type="button">全体表示</button>
        <span id="count" class="pill">読み込み中…</span>
      </div>
      <div id="cards" class="cards"></div>
      <div id="empty" class="empty">該当する動物園がありません</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const API_BASE = "/api";

    // 地図
    const map = L.map("map").setView([36.2048, 138.2529], 5);
    L.tileLayer("https://tiles.stadiamaps.com/tiles/outdoors/{z}/{x}/{y}{r}.png", {
      maxZoom: 20,
      attribution: '&copy; <a href="https://stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
    }).addTo(map);

    // state
    let allZoos = [];
    const markersById = new Map(); // id -> Leaflet marker
    const cardsById = new Map();   // id -> HTMLElement
    const koalaSummaryCache = new Map(); // zooId -> { count, sample }
    let activeId = null;

    // UI elements
    const qInput = document.getElementById("q");
    const cardsEl = document.getElementById("cards");
    const countEl = document.getElementById("count");
    const emptyEl = document.getElementById("empty");
    const clearSearchBtn = document.getElementById("clearSearch");
    const fitAllBtn = document.getElementById("fitAll");

    qInput.addEventListener("input", () => renderListAndMarkers());
    clearSearchBtn.addEventListener("click", () => {
      qInput.value = "";
      renderListAndMarkers();
      qInput.focus();
    });
    fitAllBtn.addEventListener("click", () => fitToAll());

    main().catch(err => {
      console.error(err);
      alert("初期化に失敗しました。\n\n" + err.message);
    });

    async function main() {
      const res = await fetch(`${API_BASE}/zoos`);
      if (!res.ok) throw new Error(`API error: ${res.status}`);
      const zoos = await res.json();
      if (!Array.isArray(zoos)) throw new Error("Invalid response: not an array");

      // 0,0 は除外（データ未入力のことが多い）
      allZoos = zoos.filter(z => typeof z?.lat === "number" && typeof z?.lng === "number" && !(z.lat === 0 && z.lng === 0));

      for (const z of allZoos) {
        const marker = L.marker([z.lat, z.lng]).addTo(map);
        marker.bindPopup(buildPopupHtml(z, { loading: true }));
        marker.on("click", () => {
          setActive(z.id);
          openPopupWithSummary(z);
        });
        markersById.set(z.id, marker);
      }

      // 初期描画
      renderListAndMarkers();

      // コアラ数の事前取得（キャッシュ）
      prefetchKoalaSummaries(allZoos, 4);

      // 地図を全体にフィット
      fitToAll();
    }

    function renderListAndMarkers() {
      const q = (qInput.value || "").trim().toLowerCase();

      // フィルタ
      const filtered = allZoos.filter(z => {
        const hay = `${z.name || ""} ${z.pref || ""} ${z.city || ""}`.toLowerCase();
        return q === "" ? true : hay.includes(q);
      });

      // 件数
      countEl.textContent = `${filtered.length} 件表示`;
      emptyEl.classList.toggle("show", filtered.length === 0);

      // 一覧を作り直し
      cardsEl.innerHTML = "";
      cardsById.clear();

      for (const z of filtered) {
        const card = buildCard(z);
        cardsEl.appendChild(card);
        cardsById.set(z.id, card);
      }

      // 地図のマーカー表示もフィルタに合わせる（簡易：一旦全部消して再追加）
      // Leafletはremove/addが簡単なので、小規模ならこれでOK
      for (const [id, m] of markersById.entries()) {
        map.removeLayer(m);
      }
      for (const z of filtered) {
        const m = markersById.get(z.id);
        if (m) m.addTo(map);
      }

      // アクティブがフィルタで消えたら解除
      if (activeId && !filtered.some(z => z.id === activeId)) {
        setActive(null);
      }
    }

    function buildCard(z) {
      const el = document.createElement("div");
      el.className = "card";
      el.dataset.id = z.id;

      const place = [z.pref, z.city].filter(Boolean).join(" ");
      const status = z.status || "";
      const verified = z.lastVerifiedAt ? `確認日: ${z.lastVerifiedAt}` : "";
      const url = z.officialUrl ? z.officialUrl : "";

      el.innerHTML = `
        <div class="row">
          <div class="title">${escapeHtml(z.name || "(no name)")}</div>
          <div class="pill">${escapeHtml(status)}</div>
        </div>
        <div class="sub">${escapeHtml(place)}</div>
        <div class="small">${escapeHtml(verified)}</div>
        <div class="popup-actions">
          ${url ? `<a class="action" href="${escapeAttr(url)}" target="_blank" rel="noreferrer">公式サイト</a>` : ""}
          <a class="action" href="./zoo.html?zooId=${encodeURIComponent(z.id)}">コアラを見る →</a>
        </div>
      `;

      el.addEventListener("click", () => focusZoo(z.id));
      return el;
    }

    function focusZoo(id) {
      const marker = markersById.get(id);
      const zoo = allZoos.find(z => z.id === id);
      if (!marker || !zoo) return;

      setActive(id);
      map.setView([zoo.lat, zoo.lng], 14, { animate: true });
      openPopupWithSummary(zoo);
    }

    function setActive(id) {
      // 一覧の強調
      if (activeId && cardsById.get(activeId)) cardsById.get(activeId).classList.remove("active");
      activeId = id;
      if (activeId && cardsById.get(activeId)) {
        const el = cardsById.get(activeId);
        el.classList.add("active");
        // スクロールして見える位置へ
        el.scrollIntoView({ block: "nearest" });
      }
    }

    function fitToAll() {
      const pts = allZoos.map(z => [z.lat, z.lng]);
      if (pts.length > 0) map.fitBounds(pts, { padding: [30, 30] });
    }

    async function openPopupWithSummary(z) {
      const marker = markersById.get(z.id);
      if (!marker) return;
      marker.setPopupContent(buildPopupHtml(z, { loading: true }));
      marker.openPopup();

      try {
        const summary = await getKoalaSummary(z.id);
        marker.setPopupContent(buildPopupHtml(z, summary));
      } catch (err) {
        marker.setPopupContent(buildPopupHtml(z, { error: err?.message || "failed" }));
      }
    }

    async function getKoalaSummary(zooId) {
      if (koalaSummaryCache.has(zooId)) return koalaSummaryCache.get(zooId);
      const res = await fetch(`${API_BASE}/zoos/${encodeURIComponent(zooId)}/koalas?status=alive`);
      if (!res.ok) throw new Error(`API error: ${res.status}`);
      const koalas = await res.json();
      const list = Array.isArray(koalas) ? koalas : [];
      const sample = list.find(k => k?.name) || list[0] || null;
      const summary = { count: list.length, sample };
      koalaSummaryCache.set(zooId, summary);
      return summary;
    }

    async function prefetchKoalaSummaries(zoos, concurrency) {
      const queue = [...zoos];
      const workers = Array.from({ length: concurrency }, async () => {
        while (queue.length > 0) {
          const z = queue.shift();
          if (!z) return;
          try {
            await getKoalaSummary(z.id);
          } catch {
            // 事前取得の失敗は無視
          }
        }
      });
      await Promise.all(workers);
    }

    function buildPopupHtml(z, summary) {
      const title = z.name || "(no name)";
      const place = [z.pref, z.city].filter(Boolean).join(" ");
      const status = z.status || "";
      const verified = z.lastVerifiedAt ? `確認日: ${z.lastVerifiedAt}` : "";
      const url = z.officialUrl ? `<a class="action" href="${escapeAttr(z.officialUrl)}" target="_blank" rel="noreferrer">公式サイト</a>` : "";
      const zooLink = `<a class="action" href="./zoo.html?zooId=${encodeURIComponent(z.id)}">コアラを見る →</a>`;

      let countText = "コアラ数: 読み込み中…";
      let photoUrl = placeholderPhoto(title);
      let photoAlt = title;
      if (summary?.error) {
        countText = "コアラ数: 取得失敗";
      } else if (typeof summary?.count === "number") {
        countText = `現在のコアラ: ${summary.count} 頭`;
        if (summary.sample) {
          photoUrl = koalaPhotoUrl(summary.sample);
          photoAlt = summary.sample.name || title;
        }
      }

      return `
        <div class="popup-card">
          <img class="popup-photo" src="${photoUrl}" alt="${escapeAttr(photoAlt)}">
          <div>
            <div class="popup-title">${escapeHtml(title)}</div>
            <div class="popup-sub">${escapeHtml(place)}</div>
            <div class="popup-sub">${escapeHtml(status)}</div>
            <div class="popup-sub">${escapeHtml(verified)}</div>
            <div class="popup-sub">${escapeHtml(countText)}</div>
            <div class="popup-actions">${url}${zooLink}</div>
          </div>
        </div>
      `;
    }

    function koalaPhotoUrl(k) {
      if (k?.photoUrl) return k.photoUrl;
      if (k?.imageUrl) return k.imageUrl;
      return placeholderPhoto(k?.name || "Koala");
    }

    function placeholderPhoto(label) {
      const text = (label || "Koala").slice(0, 6);
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="240" height="300">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f7efe0"/>
              <stop offset="1" stop-color="#e6d6c1"/>
            </linearGradient>
          </defs>
          <rect width="100%" height="100%" fill="url(#g)"/>
          <circle cx="72" cy="96" r="44" fill="#cdb89b"/>
          <circle cx="168" cy="96" r="44" fill="#cdb89b"/>
          <circle cx="120" cy="140" r="56" fill="#d9c6ad"/>
          <circle cx="120" cy="160" r="20" fill="#b59c7b"/>
          <circle cx="104" cy="130" r="7" fill="#4a4036"/>
          <circle cx="136" cy="130" r="7" fill="#4a4036"/>
          <text x="50%" y="250" text-anchor="middle" font-size="22" fill="#7a4b36" font-family="M PLUS Rounded 1c, sans-serif">${text}</text>
        </svg>
      `;
      return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[s]));
    }
    function escapeAttr(str) {
      // 属性用（最低限）
      return String(str).replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
