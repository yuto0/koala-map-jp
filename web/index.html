<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Koala Map JP (local)</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1f2738;
      --ink-soft: #4f5a71;
      --mist: #f5f9ff;
      --card: #ffffff;
      --frame: #d6e1f2;
      --line: #b7c7e3;
      --sky: #5b7dd9;
      --mint: #2f9f8f;
      --sun: #ffb84d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Zen Kaku Gothic New", "Noto Sans JP", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 520px at -10% -20%, #eaf2ff 0%, transparent 65%),
        radial-gradient(1200px 700px at 110% -40%, #f0fffb 0%, transparent 60%),
        linear-gradient(180deg, #f8fbff 0%, #eef3fb 100%);
    }

    header {
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--frame);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .headline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand-title {
      margin: 0;
      font-weight: 900;
      letter-spacing: 0.5px;
      font-size: clamp(20px, 2.7vw, 30px);
    }
    .brand-sub {
      color: var(--ink-soft);
      margin-top: 4px;
      font-size: 13px;
    }
    .hero-stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .stat {
      border: 1px solid var(--frame);
      border-radius: 999px;
      padding: 6px 11px;
      background: rgba(255, 255, 255, 0.9);
      font-size: 12px;
      color: var(--ink-soft);
      font-weight: 600;
    }
    .stat strong {
      color: var(--ink);
      margin-right: 4px;
    }

    #app {
      display: grid;
      grid-template-columns: minmax(280px, 1.2fr) minmax(320px, 0.9fr);
      gap: 12px;
      padding: 12px;
      min-height: calc(100vh - 94px);
    }

    .panel {
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid var(--frame);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 24px rgba(32, 55, 102, 0.08);
      position: relative;
    }

    #map {
      min-height: 420px;
      height: 100%;
    }

    #list {
      display: flex;
      flex-direction: column;
      min-height: 420px;
      max-height: calc(100vh - 118px);
    }

    .toolbar {
      padding: 12px;
      border-bottom: 1px solid var(--frame);
      display: grid;
      gap: 8px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.95), rgba(247,251,255,0.9));
    }

    .toolbar-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .toolbar input,
    .toolbar select,
    .btn {
      width: 100%;
      font-family: inherit;
      font-size: 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 10px;
      background: #fff;
      color: var(--ink);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      cursor: pointer;
      background: #f7fbff;
      font-weight: 700;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(49, 83, 143, 0.14);
    }

    .count-line {
      font-size: 12px;
      color: var(--ink-soft);
      font-weight: 600;
    }

    .cards {
      padding: 10px;
      display: grid;
      gap: 10px;
      overflow: auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--frame);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 8px 18px rgba(45, 67, 112, 0.08);
      cursor: pointer;
      opacity: 0;
      transform: translateY(8px);
      animation: rise 220ms ease forwards;
    }
    .card:hover { border-color: #99b0d9; }
    .card.active {
      border-color: var(--sky);
      box-shadow: 0 0 0 2px rgba(91, 125, 217, 0.2), 0 10px 18px rgba(45, 67, 112, 0.12);
    }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .title { font-size: 16px; font-weight: 800; letter-spacing: 0.2px; }
    .badge {
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #b7c7e3;
      border-radius: 999px;
      padding: 2px 8px;
      color: #365796;
      background: #eff5ff;
      white-space: nowrap;
    }
    .sub { color: var(--ink-soft); margin-top: 6px; font-size: 13px; }
    .small { color: var(--ink-soft); margin-top: 6px; font-size: 12px; }

    .popup-actions {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .action {
      display: inline-block;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--frame);
      background: #f6faff;
      color: var(--ink-soft);
      text-decoration: none;
    }

    .empty {
      margin: 12px;
      color: var(--ink-soft);
      font-size: 12px;
      text-align: center;
      display: none;
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 12px;
      background: rgba(255,255,255,0.7);
    }
    .empty.show { display: block; }

    .leaflet-control-attribution {
      background: rgba(255,255,255,0.76);
      border-radius: 8px;
      border: 1px solid var(--frame);
      color: var(--ink-soft);
    }
    .leaflet-popup-content-wrapper {
      background: #fefefe;
      border: 1px solid var(--frame);
      border-radius: 12px;
      box-shadow: 0 12px 24px rgba(37, 57, 99, 0.16);
    }
    .leaflet-popup-tip { background: #fefefe; }

    #map .leaflet-tile {
      filter: saturate(1.08) contrast(0.93) brightness(1.03);
    }

    .popup-card {
      min-width: 220px;
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 10px;
      align-items: center;
    }
    .popup-photo {
      width: 72px;
      height: 90px;
      border-radius: 8px;
      border: 1px solid var(--frame);
      object-fit: cover;
      background: #eef3ff;
    }
    .popup-title { font-weight: 800; }
    .popup-sub { margin-top: 4px; color: var(--ink-soft); font-size: 12px; }

    a { color: inherit; }

    @media (max-width: 980px) {
      #app {
        grid-template-columns: 1fr;
      }
      #map {
        min-height: 52vh;
      }
      #list {
        max-height: none;
      }
    }

    @media (max-width: 640px) {
      header { padding: 14px 12px 12px; }
      #app { padding: 10px; gap: 10px; }
      .toolbar-row,
      .btn-row { grid-template-columns: 1fr; }
      .cards { padding: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="headline">
      <div>
        <h1 class="brand-title">Koala Map JP</h1>
        <div class="brand-sub">全国のコアラ展示施設を地図と一覧で確認</div>
      </div>
      <div class="hero-stats">
        <span id="statZoos" class="stat"><strong>動物園</strong>読み込み中</span>
        <span id="statKoalas" class="stat"><strong>現存コアラ</strong>読み込み中</span>
        <span id="statUpdated" class="stat"><strong>最終確認</strong>-</span>
      </div>
    </div>
  </header>

  <div id="app">
    <section class="panel">
      <div id="map"></div>
    </section>

    <section id="list" class="panel">
      <div class="toolbar">
        <div class="toolbar-row">
          <input id="q" type="search" placeholder="動物園名 / 都道府県 / 市区町村で検索" />
          <select id="prefFilter">
            <option value="">都道府県: すべて</option>
          </select>
        </div>
        <div class="toolbar-row">
          <select id="sortOrder">
            <option value="name">並び順: 名前（あいうえお）</option>
            <option value="pref">並び順: 都道府県</option>
            <option value="koalas">並び順: コアラ数（多い順）</option>
          </select>
          <div class="btn-row">
            <button id="clearSearch" class="btn" type="button">条件クリア</button>
            <button id="fitAll" class="btn" type="button">全体表示</button>
          </div>
        </div>
        <div id="count" class="count-line">読み込み中…</div>
      </div>
      <div id="cards" class="cards"></div>
      <div id="empty" class="empty">該当する動物園がありません</div>
    </section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <script>
    const API_BASE = "/api";
    const db = initFirestore();

    const map = L.map("map").setView([36.2048, 138.2529], 5);
    L.tileLayer("https://tiles.stadiamaps.com/tiles/outdoors/{z}/{x}/{y}{r}.png", {
      maxZoom: 20,
      attribution: '&copy; <a href="https://stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
    }).addTo(map);

    let allZoos = [];
    const markersById = new Map();
    const cardsById = new Map();
    const koalaSummaryCache = new Map();
    let activeId = null;

    const qInput = document.getElementById("q");
    const prefFilter = document.getElementById("prefFilter");
    const sortOrder = document.getElementById("sortOrder");
    const cardsEl = document.getElementById("cards");
    const countEl = document.getElementById("count");
    const emptyEl = document.getElementById("empty");
    const clearSearchBtn = document.getElementById("clearSearch");
    const fitAllBtn = document.getElementById("fitAll");
    const statZoosEl = document.getElementById("statZoos");
    const statKoalasEl = document.getElementById("statKoalas");
    const statUpdatedEl = document.getElementById("statUpdated");

    qInput.addEventListener("input", () => renderListAndMarkers());
    prefFilter.addEventListener("change", () => renderListAndMarkers());
    sortOrder.addEventListener("change", () => renderListAndMarkers());
    clearSearchBtn.addEventListener("click", () => {
      qInput.value = "";
      prefFilter.value = "";
      sortOrder.value = "name";
      renderListAndMarkers();
      qInput.focus();
    });
    fitAllBtn.addEventListener("click", () => fitToAll());

    main().catch(err => {
      console.error(err);
      alert("初期化に失敗しました。\n\n" + err.message);
    });

    async function main() {
      const zoos = await getZoos();
      if (!Array.isArray(zoos)) throw new Error("Invalid response: not an array");

      allZoos = zoos.filter(z => typeof z?.lat === "number" && typeof z?.lng === "number" && !(z.lat === 0 && z.lng === 0));

      for (const z of allZoos) {
        const marker = L.marker([z.lat, z.lng]).addTo(map);
        marker.bindPopup(buildPopupHtml(z, { loading: true }));
        marker.on("click", () => {
          setActive(z.id);
          openPopupWithSummary(z);
        });
        markersById.set(z.id, marker);
      }

      updatePrefOptions();
      updateHeaderStats();
      renderListAndMarkers();
      fitToAll();

      await prefetchKoalaSummaries(allZoos, 4);
      updateHeaderStats();
      renderListAndMarkers();
    }

    function getFilteredAndSortedZoos() {
      const q = (qInput.value || "").trim().toLowerCase();
      const pref = prefFilter.value;
      const sort = sortOrder.value;

      const filtered = allZoos.filter(z => {
        const hay = `${z.name || ""} ${z.pref || ""} ${z.city || ""}`.toLowerCase();
        const matchQ = q === "" ? true : hay.includes(q);
        const matchPref = pref === "" ? true : (z.pref || "") === pref;
        return matchQ && matchPref;
      });

      const sorted = [...filtered].sort((a, b) => {
        if (sort === "pref") {
          const p = (a.pref || "").localeCompare(b.pref || "", "ja");
          if (p !== 0) return p;
          return (a.name || "").localeCompare(b.name || "", "ja");
        }
        if (sort === "koalas") {
          const ac = koalaSummaryCache.get(a.id)?.count ?? -1;
          const bc = koalaSummaryCache.get(b.id)?.count ?? -1;
          if (bc !== ac) return bc - ac;
          return (a.name || "").localeCompare(b.name || "", "ja");
        }
        return (a.name || "").localeCompare(b.name || "", "ja");
      });

      return sorted;
    }

    function renderListAndMarkers() {
      const filtered = getFilteredAndSortedZoos();

      countEl.textContent = `${filtered.length} 件表示`;
      emptyEl.classList.toggle("show", filtered.length === 0);

      cardsEl.innerHTML = "";
      cardsById.clear();

      for (let i = 0; i < filtered.length; i++) {
        const z = filtered[i];
        const card = buildCard(z, i);
        cardsEl.appendChild(card);
        cardsById.set(z.id, card);
      }

      for (const m of markersById.values()) {
        map.removeLayer(m);
      }
      for (const z of filtered) {
        const m = markersById.get(z.id);
        if (m) m.addTo(map);
      }

      if (activeId && !filtered.some(z => z.id === activeId)) {
        setActive(null);
      }
    }

    function buildCard(z, i) {
      const el = document.createElement("div");
      el.className = "card";
      el.dataset.id = z.id;
      el.style.animationDelay = `${Math.min(i * 18, 180)}ms`;

      const place = [z.pref, z.city].filter(Boolean).join(" ");
      const verified = z.lastVerifiedAt ? `確認日: ${z.lastVerifiedAt}` : "";
      const url = z.officialUrl ? z.officialUrl : "";
      const count = koalaSummaryCache.get(z.id)?.count;
      const koalaBadge = typeof count === "number" ? `${count}頭` : "読込中";

      el.innerHTML = `
        <div class="row">
          <div class="title">${escapeHtml(z.name || "(no name)")}</div>
          <div class="badge">コアラ ${escapeHtml(koalaBadge)}</div>
        </div>
        <div class="sub">${escapeHtml(place)}</div>
        <div class="small">${escapeHtml(verified)}</div>
        <div class="popup-actions">
          ${url ? `<a class="action" href="${escapeAttr(url)}" target="_blank" rel="noreferrer">公式サイト</a>` : ""}
          <a class="action" href="./zoo.html?zooId=${encodeURIComponent(z.id)}">一覧を見る</a>
        </div>
      `;

      el.addEventListener("click", () => focusZoo(z.id));
      return el;
    }

    function focusZoo(id) {
      const marker = markersById.get(id);
      const zoo = allZoos.find(z => z.id === id);
      if (!marker || !zoo) return;

      setActive(id);
      map.setView([zoo.lat, zoo.lng], 14, { animate: true });
      openPopupWithSummary(zoo);
    }

    function setActive(id) {
      if (activeId && cardsById.get(activeId)) cardsById.get(activeId).classList.remove("active");
      activeId = id;
      if (activeId && cardsById.get(activeId)) {
        const el = cardsById.get(activeId);
        el.classList.add("active");
        el.scrollIntoView({ block: "nearest" });
      }
    }

    function fitToAll() {
      const pts = allZoos.map(z => [z.lat, z.lng]);
      if (pts.length > 0) map.fitBounds(pts, { padding: [30, 30] });
    }

    async function openPopupWithSummary(z) {
      const marker = markersById.get(z.id);
      if (!marker) return;
      marker.setPopupContent(buildPopupHtml(z, { loading: true }));
      marker.openPopup();

      try {
        const summary = await getKoalaSummary(z.id);
        marker.setPopupContent(buildPopupHtml(z, summary));
      } catch (err) {
        marker.setPopupContent(buildPopupHtml(z, { error: err?.message || "failed" }));
      }
    }

    async function getKoalaSummary(zooId) {
      if (koalaSummaryCache.has(zooId)) return koalaSummaryCache.get(zooId);
      const koalas = await getKoalasByZoo(zooId, "alive");
      const list = Array.isArray(koalas) ? koalas : [];
      const sample = list.find(k => k?.name) || list[0] || null;
      const summary = { count: list.length, sample };
      koalaSummaryCache.set(zooId, summary);
      return summary;
    }

    async function getZoos() {
      if (db) {
        const snap = await db.collection("zoos").get();
        return snap.docs.map(toZooFromDoc);
      }
      const res = await fetch(`${API_BASE}/zoos`);
      if (!res.ok) throw new Error(`API error: ${res.status}`);
      return res.json();
    }

    async function getKoalasByZoo(zooId, status) {
      if (db) {
        const snap = await db.collection("koalas").where("currentZooId", "==", zooId).get();
        const all = snap.docs.map(toKoalaFromDoc);
        if (!status) return all;
        return all.filter(k => (k.status || "") === status);
      }
      const params = new URLSearchParams();
      if (status) params.set("status", status);
      const qs = params.toString();
      const res = await fetch(`${API_BASE}/zoos/${encodeURIComponent(zooId)}/koalas${qs ? `?${qs}` : ""}`);
      if (!res.ok) throw new Error(`API error: ${res.status}`);
      return res.json();
    }

    function toZooFromDoc(doc) {
      const m = doc.data() || {};
      const geo = m.geo || {};
      return {
        id: doc.id,
        name: asString(m.name),
        pref: asString(m.pref),
        city: asString(m.city),
        status: asString(m.status),
        officialUrl: asString(m.officialUrl),
        lastVerifiedAt: asString(m.lastVerifiedAt),
        lat: asNumber(geo.lat, m.lat),
        lng: asNumber(geo.lng, m.lng),
        note: asString(m.note),
      };
    }

    function toKoalaFromDoc(doc) {
      const m = doc.data() || {};
      return {
        id: doc.id,
        name: asString(m.name),
        sex: asString(m.sex),
        birthDate: asString(m.birthDate),
        status: asString(m.status),
        currentZooId: asString(m.currentZooId),
        motherId: asString(m.motherId),
        fatherId: asString(m.fatherId),
        photoUrl: asString(m.photoUrl),
      };
    }

    function asString(v) {
      return typeof v === "string" ? v : "";
    }

    function asNumber(...values) {
      for (const v of values) {
        if (typeof v === "number" && Number.isFinite(v)) return v;
      }
      return 0;
    }

    function initFirestore() {
      if (!window.firebase || !window.__FIREBASE_CONFIG__) return null;
      const cfg = window.__FIREBASE_CONFIG__;
      if (!cfg.apiKey || !cfg.projectId || !cfg.appId) return null;
      if (!firebase.apps.length) firebase.initializeApp(cfg);
      return firebase.firestore();
    }

    async function prefetchKoalaSummaries(zoos, concurrency) {
      const queue = [...zoos];
      const workers = Array.from({ length: concurrency }, async () => {
        while (queue.length > 0) {
          const z = queue.shift();
          if (!z) return;
          try {
            await getKoalaSummary(z.id);
          } catch {
          }
        }
      });
      await Promise.all(workers);
    }

    function updatePrefOptions() {
      const prefs = [...new Set(allZoos.map(z => z.pref).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ja"));
      prefFilter.innerHTML = `<option value="">都道府県: すべて</option>` + prefs.map(p => `<option value="${escapeAttr(p)}">${escapeHtml(p)}</option>`).join("");
    }

    function updateHeaderStats() {
      const zooCount = allZoos.length;
      let aliveKoalas = 0;
      for (const s of koalaSummaryCache.values()) {
        if (typeof s?.count === "number") aliveKoalas += s.count;
      }

      const dates = allZoos.map(z => z.lastVerifiedAt).filter(Boolean).sort();
      const latest = dates.length > 0 ? dates[dates.length - 1] : "-";

      statZoosEl.innerHTML = `<strong>動物園</strong>${zooCount}件`;
      statKoalasEl.innerHTML = `<strong>現存コアラ</strong>${aliveKoalas > 0 ? `${aliveKoalas}頭` : "集計中"}`;
      statUpdatedEl.innerHTML = `<strong>最終確認</strong>${escapeHtml(latest)}`;
    }

    function buildPopupHtml(z, summary) {
      const title = z.name || "(no name)";
      const place = [z.pref, z.city].filter(Boolean).join(" ");
      const verified = z.lastVerifiedAt ? `確認日: ${z.lastVerifiedAt}` : "";
      const url = z.officialUrl ? `<a class="action" href="${escapeAttr(z.officialUrl)}" target="_blank" rel="noreferrer">公式サイト</a>` : "";
      const zooLink = `<a class="action" href="./zoo.html?zooId=${encodeURIComponent(z.id)}">一覧を見る</a>`;

      let countText = "コアラ数: 読み込み中...";
      let photoUrl = placeholderPhoto(title);
      let photoAlt = title;
      if (summary?.error) {
        countText = "コアラ数: 取得失敗";
      } else if (typeof summary?.count === "number") {
        countText = `現在のコアラ: ${summary.count}頭`;
        if (summary.sample) {
          photoUrl = koalaPhotoUrl(summary.sample);
          photoAlt = summary.sample.name || title;
        }
      }

      return `
        <div class="popup-card">
          <img class="popup-photo" src="${photoUrl}" alt="${escapeAttr(photoAlt)}">
          <div>
            <div class="popup-title">${escapeHtml(title)}</div>
            <div class="popup-sub">${escapeHtml(place)}</div>
            <div class="popup-sub">${escapeHtml(verified)}</div>
            <div class="popup-sub">${escapeHtml(countText)}</div>
            <div class="popup-actions">${url}${zooLink}</div>
          </div>
        </div>
      `;
    }

    function koalaPhotoUrl(k) {
      if (k?.photoUrl) return k.photoUrl;
      if (k?.imageUrl) return k.imageUrl;
      return placeholderPhoto(k?.name || "Koala");
    }

    function placeholderPhoto(label) {
      const text = (label || "Koala").slice(0, 6);
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="240" height="300">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#eef4ff"/>
              <stop offset="1" stop-color="#dce8ff"/>
            </linearGradient>
          </defs>
          <rect width="100%" height="100%" fill="url(#g)"/>
          <circle cx="72" cy="96" r="44" fill="#c4d5f2"/>
          <circle cx="168" cy="96" r="44" fill="#c4d5f2"/>
          <circle cx="120" cy="140" r="56" fill="#dce7fb"/>
          <circle cx="120" cy="160" r="20" fill="#92a8d7"/>
          <circle cx="104" cy="130" r="7" fill="#3a4e77"/>
          <circle cx="136" cy="130" r="7" fill="#3a4e77"/>
          <text x="50%" y="250" text-anchor="middle" font-size="22" fill="#35548e" font-family="Zen Kaku Gothic New, sans-serif">${text}</text>
        </svg>
      `;
      return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[s]));
    }

    function escapeAttr(str) {
      return String(str).replace(/"/g, "&quot;");
    }
  </script>
</body>
